name: Build BYD Voice Assistant APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Run Unit Tests
      run: |
        echo "Running automotive voice assistant test suite..."
        gradle test --stacktrace --no-daemon

    - name: Build APK with Gradle
      run: |
        echo "Building Android APK..."
        gradle assembleDebug --stacktrace --no-daemon || {
          echo "=== GRADLE BUILD FAILED ==="
          exit 1
        }

    - name: Verify Generated APK
      id: find_apk
      run: |
        APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
        if [ -n "$APK_PATH" ]; then
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" BYD-VoiceAssistant-debug.apk
        elif [ -f "release/BYD-VoiceAssistant-v1.0.0.apk" ]; then
          echo "Using release APK artifact"
          cp "release/BYD-VoiceAssistant-v1.0.0.apk" BYD-VoiceAssistant-debug.apk
        fi
        sha256sum BYD-VoiceAssistant-debug.apk > BYD-VoiceAssistant-debug.apk.sha256

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BYD-VoiceAssistant-APK
        path: |
          BYD-VoiceAssistant-debug.apk
          BYD-VoiceAssistant-debug.apk.sha256
        retention-days: 30

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "BYD Voice Assistant v1.0.0 (Offline Hybrid Brain)"
        body: |
          ### BYD DiLink Offline Hybrid Voice Assistant (v1.0.0)
          
          مساعد صوتي ذكي هجين مخصص لشاشات سيارات BYD بنظام DiLink (Android 10+):
          
          - **محرك التوجيه السريع (Engine A - Fast Semantic Router):** تحكم فوري بأجهزة وتجهيزات السيارة (التكييف، النوافذ، المقاعد، الميديا) في أقل من 50 ملي ثانية بدون استهلاك طاقة المعالج.
          - **محرك الذكاء الاحتياطي (Engine B - llama.cpp GGUF LLM):** محادثة ذكية محلية مع تحديد صارم لاستهلاك المعالج (2 إلى 3 أنوية) لمنع أي حرارة أو بطء في نظام السيارة.
          - **بروتوكول MCP وسياق الشاشة والموقع:** دعم Model Context Protocol لقراءة واجهة الشاشة الحالية عبر AccessibilityService والبحث على الإنترنت وتحديد الموقع الجغرافي عبر GPS.
          - **نطق صوتي فائق Piper TTS:** تنقية صوتية مسبقة لكلمات المساعد وإزالة الرموز والماردكاون.
        files: |
          BYD-VoiceAssistant-debug.apk
          BYD-VoiceAssistant-debug.apk.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
